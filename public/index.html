<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#dc2626" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="크뮤 - KBO 프로야구 구단별 현재 응원가, 등장곡 및 추억의 응원가 플레이어"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>크뮤 - 프로야구 응원가 플레이어</title>
    <script>
      // 모바일 네이티브 앱(Capacitor) 환경에서는 Google AdSense를 로드하지 않고 웹 배포에서만 로드
      (function () {
        var isCapacitorNative =
          window.location.protocol === "capacitor:" ||
          window.location.protocol === "ionic:" ||
          (window.Capacitor &&
            typeof window.Capacitor.isNativePlatform === "function" &&
            window.Capacitor.isNativePlatform());
        var isLocalWebViewHost =
          window.location.hostname === "localhost" &&
          /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (!isCapacitorNative && !isLocalWebViewHost) {
          var adsScript = document.createElement("script");
          adsScript.async = true;
          adsScript.src =
            "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7135279995407634";
          adsScript.crossOrigin = "anonymous";
          document.head.appendChild(adsScript);
        }
      })();
    </script>
  </head>
  <body>
    <noscript>이 앱을 실행하려면 JavaScript를 활성화해야 합니다.</noscript>
    <div id="root"></div>
  </body>
</html>
